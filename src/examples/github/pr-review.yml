# Copy this file to .github/workflows/pr-review.yml in the TARGET repo
# (the repo whose PRs you want reviewed), on its default branch.

name: PR Auto Review
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout target repo (PR head, full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Checkout pr-reviewer
        uses: actions/checkout@v4
        with:
          repository: YOUR_USERNAME/pr-reviewer
          ref: v1.0.0                    # pin a tag, don't track main
          path: .pr-reviewer
          # token: ${{ secrets.REVIEWER_REPO_TOKEN }}   # only needed if pr-reviewer is private

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install reviewer dependencies only
        run: npm ci --ignore-scripts
        working-directory: .pr-reviewer

      - name: Run PR review
        run: npm run review:pr
        working-directory: .pr-reviewer
        env:
          VCS_PLATFORM: github
          VCS_TOKEN: ${{ secrets.GITHUB_TOKEN }}     # auto-provided by GitHub
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
          REPO_ROOT: ${{ github.workspace }}
          LLM_BASE_URL: https://ollama.com
          LLM_MODEL: gpt-oss:120b-cloud
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}

# Required repo secrets (Settings → Secrets and variables → Actions):
#   LLM_API_KEY            - Ollama Cloud API key
#   REVIEWER_REPO_TOKEN     - only if pr-reviewer repo is private (Contents: Read)